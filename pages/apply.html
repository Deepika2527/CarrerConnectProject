<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply | CareerConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                CareerConnect
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbar">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="jobs.html">
                            Jobs
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="courses.html">
                            Courses
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

                <div class="d-flex gap-2">

                    <a href="login.html"
                       class="btn btn-outline-primary">
                        Login
                    </a>

                    <a href="signup.html"
                       class="btn btn-primary">
                        Sign Up
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- Application Form -->

    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-8">

                    <div class="job-card">

                        <h1>Apply for Frontend Developer</h1>

                        <p class="text-muted">
                            TechNova Solutions
                        </p>

                        <hr>

                        <form>

                            <!-- Name -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter your name"
                                >

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                >

                            </div>


                            <!-- Phone -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Enter your phone number"
                                >

                            </div>


                            <!-- Experience -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Experience
                                </label>

                                <select class="form-select">

                                    <option>
                                        Select Experience
                                    </option>

                                    <option>
                                        Fresher
                                    </option>

                                    <option>
                                        1 - 2 Years
                                    </option>

                                    <option>
                                        2 - 5 Years
                                    </option>

                                    <option>
                                        5+ Years
                                    </option>

                                </select>

                            </div>


                            <!-- Resume -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Upload Resume
                                </label>

                                <input
                                    type="file"
                                    class="form-control"
                                >

                            </div>


                            <!-- Cover Letter -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Cover Letter
                                </label>

                                <textarea
                                    class="form-control"
                                    rows="5"
                                    placeholder="Write a short message..."
                                ></textarea>

                            </div>


                            <!-- Submit -->

                            <button
                                type="submit"
                                class="btn btn-primary">
                                Submit Application
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer class="footer">

        <div class="container text-center">

            <h5>CareerConnect</h5>

            <p>
                Find jobs. Build skills. Grow your career.
            </p>

            <hr>

            <p class="copyright">
                © 2026 CareerConnect. All rights reserved.
            </p>

        </div>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
