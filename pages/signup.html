<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | CareerConnect</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                CareerConnect
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbar">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="jobs.html">
                            Jobs
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="courses.html">
                            Courses
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

                <div class="d-flex gap-2">

                    <a href="login.html"
                       class="btn btn-outline-primary">
                        Login
                    </a>

                    <a href="signup.html"
                       class="btn btn-primary">
                        Sign Up
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- Signup -->

    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="job-card">

                        <h1 class="text-center">
                            Create Your Account
                        </h1>

                        <p class="text-center text-muted">
                            Join CareerConnect and start your career journey.
                        </p>

                        <hr>

                        <form>

                            <!-- Name -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter your name"
                                >

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                >

                            </div>


                            <!-- Phone -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Enter your phone number"
                                >

                            </div>


                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Create a password"
                                >

                            </div>


                            <!-- Confirm Password -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Confirm your password"
                                >

                            </div>


                            <!-- Role -->

                            <div class="mb-3">

                                <label class="form-label">
                                    I am a
                                </label>

                                <select class="form-select">

                                    <option>
                                        Select
                                    </option>

                                    <option>
                                        Student
                                    </option>

                                    <option>
                                        Job Seeker
                                    </option>

                                    <option>
                                        Employer
                                    </option>

                                </select>

                            </div>


                            <!-- Submit -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100">
                                Create Account
                            </button>

                        </form>


                        <p class="text-center mt-3">

                            Already have an account?

                            <a href="login.html">
                                Login
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer class="footer">

        <div class="container text-center">

            <h5>CareerConnect</h5>

            <p>
                Find jobs. Build skills. Grow your career.
            </p>

            <hr>

            <p class="copyright">
                © 2026 CareerConnect. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
